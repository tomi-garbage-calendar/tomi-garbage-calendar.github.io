<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000" media="(prefers-color-scheme: dark)">
  <title>東御市ごみ出しカレンダー</title>
  <link rel="stylesheet" href="calendar.css">
  <link rel="stylesheet" href="collection-location.css">
  <script type="module" src="calendar.js"></script>
  <script type="module" src="collection-location.js"></script>
</head>
<body>
  <main>
    <header>
      <h1 data-text="title">非公式 東御市ごみ出しカレンダー</h1>
    </header>
    <section class="district-picker">
      <label for="district" data-text="district">お住まいの地区</label>
      <select id="district" disabled>
        <option value="" data-text="choose">地区を選択してください</option>
      </select>
    </section>
    <div class="day-picker" role="group" aria-label="確認する日">
      <button type="button" data-day="0" data-text="today" aria-pressed="true">今日</button>
      <button type="button" data-day="1" data-text="tomorrow" aria-pressed="false">明日</button>
      <button type="button" data-day="2" data-text="dayAfter" aria-pressed="false">明後日</button>
    </div>
    <section class="result" aria-live="polite" aria-atomic="true">
      <h2><time id="date"></time></h2>
      <p id="status" data-text="loading">読み込み中…</p>
      <ul id="items" hidden></ul>
    </section>
    <button type="button" id="retry" data-text="retry" hidden>もう一度読み込む</button>
    <nav id="district-links" aria-label="地区のカレンダー" hidden>
      <a id="calendar-link" data-text="fullCalendar">年間の収集予定</a>
      <a id="ics-link" data-text="ics">ICSで購読</a>
    </nav>
    <noscript>収集予定を表示するにはJavaScriptを有効にしてください。</noscript>
  </main>
  <footer>
    <p data-text="unofficial">このサイトは東御市の非公式サイトです。情報は間違っている場合があります。</p>
    <a href="https://www.city.tomi.nagano.jp/category/gomi/150910.html" data-text="official">東御市公式カレンダー</a>
  </footer>
</body>
</html>
