name: 確認済みカレンダーを GitHub Pages に公開

on:
  pull_request:
    paths:
      - 'data/approved/**'
      - 'scripts/**'
      - 'site/**'
      - 'requirements.txt'
      - '.github/workflows/pages.yml'
  push:
    branches: [main]
    paths:
      - 'data/approved/**'
      - 'scripts/**'
      - 'site/**'
      - 'requirements.txt'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tomi-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.build.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build site and district ICS feeds from approved JSON
        id: build
        run: |
          if ! compgen -G 'data/approved/*.json' > /dev/null; then
            echo '確認済みJSONがありません' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python scripts/build.py dist
          echo 'ready=true' >> "$GITHUB_OUTPUT"
      - name: Verify published source hashes
        if: steps.build.outputs.ready == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: python scripts/pipeline.py verify-publication
      - uses: actions/upload-pages-artifact@v4
        if: steps.build.outputs.ready == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: dist
  deploy:
    if: needs.build.outputs.ready == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Show calendar feed URLs
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          {
            echo '## 地区別ICS'
            for district in tanaka shigeno tokida-tanaka netsu kanou kitamimaki-east kitamimaki-west; do
              printf -- '- [%s](%s/%s.ics)\n' "$district" "${PAGES_URL%/}" "$district"
            done
          } >> "$GITHUB_STEP_SUMMARY"
